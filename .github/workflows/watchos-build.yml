      - name: Prepare AEC app icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sips --resampleWidth 880 branding/aec-logo.jpeg --out build/aec-logo.png --setProperty format png
          sips --padToHeightWidth 1024 1024 --padColor FFFFFF build/aec-logo.png
          python3 - <<'PYICON'
          from pathlib import Path
          import json, shutil
          for target, platform in [('iOS', 'ios'), ('watchOS Watch App', 'watchos')]:
              folder = Path(target) / 'Assets.xcassets/AppIcon.appiconset'
              shutil.copyfile('build/aec-logo.png', folder / 'AECIcon.png')
              (folder / 'Contents.json').write_text(json.dumps({'images': [{'idiom': 'universal', 'platform': platform, 'size': '1024x1024', 'filename': 'AECIcon.png'}], 'info': {'author': 'xcode', 'version': 1}}))
          PYICON
      - name: Build watchOS simulator target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild -project ChatGPT.xcodeproj \
            -scheme ChatGPTWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build 2>&1 | tee build/simulator.log
      - name: Archive real iPhone app with embedded Apple Watch app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ChatGPT.xcodeproj \
            -scheme ChatGPTiPhoneWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iphone-watch.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            archive 2>&1 | tee build/archive.log
      - name: Validate app container and package unsigned IPA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, plistlib, shutil, subprocess

          applications = Path('build/iphone-watch.xcarchive/Products/Applications')
          apps = list(applications.glob('*.app'))
          if len(apps) != 1:
              raise SystemExit('Expected one real iPhone application in archive')
          phone = apps[0]
          phone_info = plistlib.loads((phone / 'Info.plist').read_bytes())
          if phone_info.get('ITSWatchOnlyContainer'):
              raise SystemExit('Refusing an un-installable watch-only shell container')
          if phone_info.get('CFBundleSupportedPlatforms') != ['iPhoneOS']:
              raise SystemExit('Expected an iPhoneOS app, not a simulator app')
          watches = list((phone / 'Watch').glob('*.app'))
          if len(watches) != 1:
              raise SystemExit('Expected one embedded Apple Watch application')
          watch = watches[0]
          watch_info = plistlib.loads((watch / 'Info.plist').read_bytes())
          if watch_info.get('CFBundleSupportedPlatforms') != ['WatchOS']:
              raise SystemExit('Expected a WatchOS device app')
          if watch_info.get('WKWatchOnly'):
              raise SystemExit('Expected a watch app with an iPhone companion')
          if watch_info.get('WKCompanionAppBundleIdentifier') != phone_info['CFBundleIdentifier']:
              raise SystemExit('Watch companion bundle identifier does not match iPhone app')
          if not watch_info['CFBundleIdentifier'].startswith(phone_info['CFBundleIdentifier'] + '.'):
              raise SystemExit('Watch bundle identifier must be prefixed by iPhone bundle identifier')
          macho = {bytes.fromhex(s) for s in ('feedface', 'cefaedfe', 'feedfacf', 'cffaedfe', 'cafebabe', 'bebafeca', 'cafebabf', 'bfbafeca')}
          for app, info in ((phone, phone_info), (watch, watch_info)):
              if (app / info['CFBundleExecutable']).read_bytes()[:4] not in macho:
                  raise SystemExit('Expected a built device executable in ' + app.name)
          for app, info in ((phone, phone_info), (watch, watch_info)):
              if info.get('CFBundleDisplayName') != 'AEC GPT':
                  raise SystemExit('Unexpected app display name')
              if not (app / 'Assets.car').is_file():
                  raise SystemExit('Missing compiled icon assets')
          payload = Path('build/ipa/Payload').resolve()
          payload.mkdir(parents=True, exist_ok=True)
          shutil.copytree(phone, payload / phone.name, symlinks=True, dirs_exist_ok=True)
          output = Path('build/ChatGPTClient-AppleWatch-unsigned.ipa').resolve()
          subprocess.run(['ditto', '-c', '-k', '--keepParent', str(payload), str(output)], check=True)
          with ZipFile(output) as ipa:
              if ipa.testzip() is not None:
                  raise SystemExit('IPA archive failed its integrity check')
              for app, info in ((phone, phone_info), (watch, watch_info)):
                  relative = app.relative_to(phone.parent).as_posix()
                  packed = plistlib.loads(ipa.read('Payload/' + relative + '/Info.plist'))
                  if packed != info:
                      raise SystemExit('IPA contents do not match built application')
          print(json.dumps({'iphone': phone_info['CFBundleIdentifier'], 'watch': watch_info['CFBundleIdentifier'], 'ipa_bytes': output.stat().st_size}))
          PY
      - name: Save unsigned IPA, archive and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-watch-unsigned-ipa
          path: |
            build/*.log
            build/*.ipa
            build/iphone-watch.xcarchive
          retention-days: 7
          if-no-files-found: warn

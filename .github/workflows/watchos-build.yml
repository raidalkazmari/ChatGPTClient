          /vvv/wKdPzJACZYBAA=="""
          manifest = json.loads(gzip.decompress(base64.b64decode(packed)))
          root = Path.cwd().resolve()

          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          # Check all inputs before writing any prepared files.
          for relative in sorted(set(manifest["original"]) | set(manifest["updates"])):
              target = (root / relative).resolve()
              if not target.is_relative_to(root):
                  raise SystemExit("Invalid project path: " + relative)
              existing = blob_sha(target.read_bytes()) if target.is_file() else None
              original_sha = manifest["original"].get(relative)
              update = manifest["updates"].get(relative)
              allowed = {original_sha}
              if update:
                  allowed.add(update["sha"])
              if existing not in allowed:
                  raise SystemExit("Project differs from the expected source: " + relative)
              if original_sha is not None and existing is None:
                  raise SystemExit("Required source file is missing: " + relative)

          for relative, update in manifest["updates"].items():
              data = base64.b64decode(update["content"])
              if blob_sha(data) != update["sha"]:
                  raise SystemExit("Invalid prepared file: " + relative)
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print("Prepared", len(manifest["updates"]), "files from source", manifest["source_commit"])
          PY
      - name: Build watchOS simulator target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild -project ChatGPT.xcodeproj \
            -scheme ChatGPTWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build 2>&1 | tee build/simulator.log
      - name: Archive unsigned watch app and its distribution container
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ChatGPT.xcodeproj \
            -scheme ChatGPTWatchDistribution \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unsigned-watch.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            archive 2>&1 | tee build/archive.log
      - name: Save unsigned archive and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-applewatch-archive
          path: |
            build/*.log
            build/unsigned-watch.xcarchive
          retention-days: 7
          if-no-files-found: warn
